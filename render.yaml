services:
  - type: web
    name: soccer-fan-poll-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
      - key: POLL_INTERVAL_HOURS
        value: "4"
      - key: PORT
        value: "10000"
